<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
#map {
  height: 600px;
  width: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabaseUrl = "https://teeqoyzreaxwvxedhnix.supabase.co"
const supabaseAnonKey = "sb_publishable_7zddmFR4CsJEw8iwlLJxaQ_b7yw_6Tg"

const supabase = createClient(supabaseUrl, supabaseAnonKey)

const map = L.map("map").setView([40.744, -74.032], 13)

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {
    attribution: "&copy; OpenStreetMap &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 20
  }
).addTo(map)

async function loadCustomers() {

  const { data, error } = await supabase
    .from("customer_location")
    .select("*")

  if (error) {
    console.error(error)
    return
  }

  data.forEach(customer => {

    const lat = Number(customer.latitude)
    const lng = Number(customer.longitude)

    L.marker([lat, lng])
      .addTo(map)
      .bindPopup("Customer: " + customer.customer_id)

  })

}

loadCustomers()

</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
